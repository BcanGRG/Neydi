[versions]
# --- Temel ---
# Hepsi 2026-08-13'te Maven metadata'sindan dogrulandi.
# AGP 9. Engel HALA VAR ama artik yapisal olarak asildi:
# 'com.android.application' ile 'org.jetbrains.kotlin.multiplatform' ayni modulde
# 9.3.1'de de uygulanamiyor. Cozum bypass flag'i degil, MODUL BOLUNMESI:
#   :composeApp -> com.android.kotlin.multiplatform.library (kutuphane)
#   :androidApp -> com.android.application (APK, ince)
# Bypass flag'leri (android.builtInKotlin=false + android.newDsl=false) calisiyor
# ama AGP 10.0'da kaldiriliyorlar ve newDsl=false yeni DSL'i kapatiyor.
# Detay ve tuzaklar: docs/ROADMAP.md F10.1.
agp = "9.3.1"
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"          # Nav3 icin minimum 1.10
# material3 CMP'de AYRI SURUMLENIYOR. compose.material3 kisayolu 1.11.1'i degil
# ComposeBuildConfig.composeMaterial3Version'i cozuyordu, o da 1.9.0. Kisayoldan
# acik koordinata gecerken buraya "1.11.1" yazmak artifact'i BULAMAZ (material3'un
# 1.11.1 diye bir surumu hic yok; stabil zinciri 1.9.0'da, sonrasi 1.12.0-alpha).
# Dogrulama: compose-gradle-plugin-1.11.1.jar icindeki ComposeBuildConfig.kt.
composeMaterial3 = "1.9.0"
ksp = "2.3.11"                            # KSP2 bagimsiz surumleme; Room baglanirken tekrar dogrula

# --- Android ---
androidMinSdk = "26"
androidTargetSdk = "37"
androidCompileSdk = "37"
# 1.12.4: modul bolunmesinden SONRA zorunlu oldu. Tek moduldeyken derleme ve
# calisma zamani ayni classpath'ti ve kayma gorunmuyordu; bolununce
# :androidApp 1.12.0'a derleyip 1.12.4 calistirdi ve setContent imzasi
# degistigi icin uygulama acilista NoSuchMethodError ile coktu.
# Grafigi 1.12.4'e ceken baska bir bagimlilik var; pini ona hizaliyoruz.
androidxActivityCompose = "1.12.4"

# --- Navigation 3 (CMP) ---
# navigation3-runtime AndroidX'ten gelir ve zaten KMP.
# navigation3-ui'nin iOS hedefi YOK -> JetBrains portu kullanilir.
navigation3Ui = "1.1.1"
# lifecycle 2.11.0 DEGIL: AGP 9.1.0+ ve compileSdk 37 dayatiyor, AGP 8'de kalma
# kararimizla cakisiyor. 2.10.0 zaten JetBrains'in CMP+Nav3 dokumaninda yazan surum.
# Kural: CMP tarafinda "Maven'daki en son" degil, "JetBrains'in dokumanda yazdigi" alinir.
lifecycle = "2.11.0"

# --- DI / async / serialization ---
koin = "4.2.2"
coroutines = "1.11.0"
serialization = "1.11.0"
datetime = "0.8.0"

# --- Henuz baglanmadi, sirasi gelince acilacak ---
room = "3.0.1"                            # androidx.room3 (2.x DEGIL - koordinat degisti)
sqlite = "2.7.0"
ktor = "3.5.2"
supabase = "3.7.0"
filekit = "0.14.2"                        # 0.15.0 cok yeni; 2 aylik saha suresi olani pinliyoruz
coil = "3.5.0"

[libraries]
# Compose Multiplatform
# compose.runtime / foundation / material3 / ui / components.resources / preview
# kisayollarinin HEPSI CMP 1.11.1'de @Deprecated("Specify dependency directly").
# Gradle bunlari basmaz (Kotlin DSL script uyarilari yuzeye cikmaz), IDE gosterir.
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "composeMaterial3" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }

# Preview: IKI AYRI ARTIFACT VAR, ayni ismi tasiyan IKI AYRI anotasyonla.
#   components:components-ui-tooling-preview -> org.jetbrains.compose.ui.tooling.preview.Preview
#       7 parametre. uiMode YOK, MultiPreview YOK.
#   ui:ui-tooling-preview                    -> androidx.compose.ui.tooling.preview.Preview
#       13 parametre + @PreviewLightDark / @PreviewFontScale + @PreviewWrapper.
# Ikincisini aliyoruz: bu uygulamanin ayri bir karanlik paleti var, previewlerin
# tek anotasyonla iki temayi da gosterebilmesi sart. 1.11.1'de ikisi de bu projenin
# iki iOS hedefini (iosarm64 + iossimulatorarm64) yayinliyor, commonMain'de guvenli.
#
# TUZAK: IDE'nin compose.components.uiToolingPreview icin onerdigi ReplaceWith
# "org.jetbrains.compose.ui:ui-tooling-preview" diyor ama accessor aslinda
# components-ui-tooling-preview'i cozuyor. Quick-fix'e korlemesine uyarsan
# artifact SESSIZCE degisir. Buradaki secim bilincli.
compose-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
# Previewleri Android Studio'da CIZEN renderer. Yalnizca debug, yalnizca Android.
compose-ui-tooling = { module = "org.jetbrains.compose.ui:ui-tooling", version.ref = "composeMultiplatform" }

# Navigation 3
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3Ui" }
lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

# Kotlin ekosistemi
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# DI
koin-bom = { module = "io.insert-koin:koin-bom", version.ref = "koin" }
koin-core = { module = "io.insert-koin:koin-core" }
koin-compose = { module = "io.insert-koin:koin-compose" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel" }
koin-android = { module = "io.insert-koin:koin-android" }

# Android
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }

# Room 3 (androidx.room3 - 2.x DEGIL)
room-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# Host testleri JVM'de kosuyor ve sqlite-bundled'in ANDROID varyanti JNI'yi
# cihazdan yukluyor -> "no sqliteJni in java.library.path". Masaustu native'leri
# tasiyan jvm varyanti yalnizca test siniffina eklenir.
sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "sqlite" }

# --- Asagidakiler catalog'da hazir bekliyor, henuz build.gradle.kts'e eklenmedi ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-storage = { module = "io.github.jan-tennert.supabase:storage-kt" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
# AGP 9'dan itibaren KMP modulu com.android.application UYGULAYAMAZ.
# composeApp bu eklentiyle kutuphane olur; APK'yi ince :androidApp uretir.
androidKmpLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Marker: androidx.room3:androidx.room3.gradle.plugin - Google Maven'de mevcut (dogrulandi).
androidxRoom3 = { id = "androidx.room3", version.ref = "room" }
