org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

# iOS hedefleri Windows'ta derlenemez; Mac'e gecince kaldirilacak bir sey yok,
# Gradle zaten yalnizca host'un destekledigi hedefleri derler.
# Bu flag sadece "iosX64Test devre disi" uyarilarini susturur - hedefleri KALDIRMAZ.
kotlin.native.ignoreDisabledTargets=true
